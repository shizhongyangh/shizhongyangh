<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="84" viewBox="0 0 1600 84" fill="none" role="presentation">
  <style>
    .ln{stroke:url(#lg);stroke-width:1.35;fill:none;stroke-linecap:round}
    .r1{stroke-dasharray:150 850;stroke-dashoffset:1000;animation:f1 8s linear infinite}
    .r2{stroke-dasharray:80 920;stroke-dashoffset:0;animation:f2 11s linear infinite}
