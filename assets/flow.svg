  <path class="ln r1" pathLength="1000" d="M0 46C160 26 300 62 470 44C640 26 780 22 950 40C1120 58 1300 54 1600 34"/>
  <path class="ln r2" pathLength="1000" d="M0 46C160 26 300 62 470 44C640 26 780 22 950 40C1120 58 1300 54 1600 34"/>
