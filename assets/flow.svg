      <stop offset=".5" stop-color="#46D9C8" stop-opacity=".9"/>
      <stop offset=".84" stop-color="#FF7FA8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FF7FA8" stop-opacity="0"/>
    </linearGradient>
  </defs>
